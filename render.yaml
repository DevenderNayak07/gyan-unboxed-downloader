
services:
  - type: web
    name: gyan-unboxed-downloader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGIN
        value: https://gyanunboxedd.blogspot.com
      - key: TURNSTILE_SECRET_KEY
        sync: false
